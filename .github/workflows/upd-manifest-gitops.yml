name: Upd Manifest GitOps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  
jobs:
  update-manifest:
    runs-on: arc-org-runner-set
    steps:
      - name: Checkout GitOps Repo
        env:
          GHA_PAT: ${{ secrets.GHA_PAT }}
        run: |
          # Clonamos el repo de manifiestos usando el PAT inyectado
          git clone https://x-access-token:$GHA_PAT@github.com/${{ github.repository_owner }}/gitops-manifests.git
          cd gitops-manifests
          
          # Simulamos actualizar un archivo de versión
          echo "tag: ${{ github.sha }}" > image-tag.txt
          
          # Configuramos identidad de Git
          git config user.name "ARC Automation"
          git config user.email "arc@automation.com"
          
          # Hacemos push de la nueva versión
          git add .
          git commit -m "deploy: update image to ${{ github.sha }}"
          git push
      - name: Update Dev Overlay
        if: github.ref == 'refs/heads/main'
        run: |
          cd gitops-manifests/overlays/dev
          # Usamos kustomize para actualizar la imagen (es más limpio que sed)
          kustomize edit set image my-python-app=ghcr.io/${{ github.repository }}:${{ github.sha }}
          
          git config --global user.name "ARC Automation"
          git config --global user.email "arc@automation.com"
          git add .
          git commit -m "deploy(dev): update image to ${{ github.sha }}"
          git push

      # ESCENARIO A: Actualización de DEV (automático al hacer push a main)
      - name: Update DEV Environment
        if: github.ref == 'refs/heads/main'
        run: |
          cd gitops/overlays/dev
          # Usamos kustomize para actualizar la imagen solo en DEV
          kustomize edit set image my-app=ghcr.io/${{ github.repository }}:${{ github.sha }}
          git config user.name "ARC Automation"
          git config user.email "arc@automation.com"
          git commit -am "chore(dev): promote to ${{ github.sha }}"
          git push

      # ESCENARIO B: Actualización de PROD (solo cuando creas un tag)
      - name: Update PROD Environment
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd gitops/overlays/prod
          # Usamos kustomize para actualizar la imagen solo en PROD
          kustomize edit set image my-app=ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          git config user.name "ARC Automation"
          git config user.email "arc@automation.com"
          git commit -am "release(prod): upgrade to ${{ github.ref_name }}"
          git push
